# ==========================================
# POD 1: Qwen2.5-Coder 3B (Autocompletado)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-qwen-3b
  labels:
    app: ollama-qwen-3b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-qwen-3b
  template:
    metadata:
      labels:
        app: ollama-qwen-3b
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        env:
        - name: OLLAMA_KEEP_ALIVE
          value: "-1"
        command: ["/bin/sh", "-c"]
        args: ["ollama serve & sleep 5 && ollama pull qwen2.5-coder:3b && wait"]
        ports:
        - containerPort: 11434
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "3"
            memory: "6Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: svc-ollama-qwen-3b
spec:
  selector:
    app: ollama-qwen-3b
  ports:
  - protocol: TCP
    port: 11434
    targetPort: 11434
---

